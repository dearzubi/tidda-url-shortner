name: AWS Destroy

on:
  workflow_dispatch:
    inputs:
      rds_final_snapshot:
        description: Final RDS snapshot behaviour.
        required: true
        type: choice
        default: skip
        options:
          - skip
          - create
      confirm_project:
        description: Project name confirmation.
        required: true
        type: string

concurrency:
  group: aws-production-mutation
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ vars.AWS_DESTROY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tidda-github-destroy-${{ github.run_id }}
          allowed-account-ids: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}

      - name: Destroy AWS stack
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          PROJECT: ${{ vars.PROJECT }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          ECS_SUBNET_COUNT: ${{ vars.ECS_SUBNET_COUNT }}
          INTERFACE_ENDPOINT_SUBNET_COUNT: ${{ vars.INTERFACE_ENDPOINT_SUBNET_COUNT }}
          BACKEND_CPU: ${{ vars.BACKEND_CPU }}
          BACKEND_MEMORY: ${{ vars.BACKEND_MEMORY }}
          BACKEND_DESIRED_COUNT: ${{ vars.BACKEND_DESIRED_COUNT }}
          RDS_INSTANCE_CLASS: ${{ vars.RDS_INSTANCE_CLASS }}
          RDS_ALLOCATED_STORAGE_GB: ${{ vars.RDS_ALLOCATED_STORAGE_GB }}
          RDS_MAX_ALLOCATED_STORAGE_GB: ${{ vars.RDS_MAX_ALLOCATED_STORAGE_GB }}
          RDS_MULTI_AZ: ${{ vars.RDS_MULTI_AZ }}
          RDS_BACKUP_RETENTION_DAYS: ${{ vars.RDS_BACKUP_RETENTION_DAYS }}
          REDIS_NODE_TYPE: ${{ vars.REDIS_NODE_TYPE }}
          REDIS_REPLICAS_PER_NODE_GROUP: ${{ vars.REDIS_REPLICAS_PER_NODE_GROUP }}
          LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS }}
          APP_SECRET_RECOVERY_WINDOW_DAYS: ${{ vars.APP_SECRET_RECOVERY_WINDOW_DAYS }}
          RDS_FINAL_SNAPSHOT: ${{ inputs.rds_final_snapshot }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/aws/scripts/destroy.sh
