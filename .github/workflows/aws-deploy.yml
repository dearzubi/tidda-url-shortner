name: AWS Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: aws-production-mutation
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production

    steps:
      - name: Checkout workflow run SHA
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual SHA
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set deploy SHA
        id: deploy_sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check workflow run is current main
        if: github.event_name == 'workflow_run'
        env:
          DEPLOY_GITHUB_SHA: ${{ steps.deploy_sha.outputs.sha }}
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$DEPLOY_GITHUB_SHA" != "$current_main_sha" ]; then
            printf 'Refusing to deploy stale workflow run SHA %s. Current main is %s.\n' "$DEPLOY_GITHUB_SHA" "$current_main_sha" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tidda-github-deploy-${{ github.run_id }}
          allowed-account-ids: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}

      - name: Deploy AWS stack
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          PROJECT: ${{ vars.PROJECT }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_SHA: ${{ steps.deploy_sha.outputs.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          ECS_SUBNET_COUNT: ${{ vars.ECS_SUBNET_COUNT }}
          INTERFACE_ENDPOINT_SUBNET_COUNT: ${{ vars.INTERFACE_ENDPOINT_SUBNET_COUNT }}
          BACKEND_CPU: ${{ vars.BACKEND_CPU }}
          BACKEND_MEMORY: ${{ vars.BACKEND_MEMORY }}
          BACKEND_DESIRED_COUNT: ${{ vars.BACKEND_DESIRED_COUNT }}
          RDS_INSTANCE_CLASS: ${{ vars.RDS_INSTANCE_CLASS }}
          RDS_ALLOCATED_STORAGE_GB: ${{ vars.RDS_ALLOCATED_STORAGE_GB }}
          RDS_MAX_ALLOCATED_STORAGE_GB: ${{ vars.RDS_MAX_ALLOCATED_STORAGE_GB }}
          RDS_MULTI_AZ: ${{ vars.RDS_MULTI_AZ }}
          RDS_BACKUP_RETENTION_DAYS: ${{ vars.RDS_BACKUP_RETENTION_DAYS }}
          REDIS_NODE_TYPE: ${{ vars.REDIS_NODE_TYPE }}
          REDIS_REPLICAS_PER_NODE_GROUP: ${{ vars.REDIS_REPLICAS_PER_NODE_GROUP }}
          LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS }}
          APP_SECRET_RECOVERY_WINDOW_DAYS: ${{ vars.APP_SECRET_RECOVERY_WINDOW_DAYS }}
        run: bash infra/aws/scripts/deploy.sh
